# Dedicated synthetic site only. Never mount a production/current local site's volumes.
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: operating-expenses-local-only
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    volumes:
      - operating-db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 40
  redis:
    image: redis:8-alpine
  backend:
    image: deeplinkerp-local:procurement-nav-20261005
    command: [sleep, infinity]
    working_dir: /home/frappe/frappe-bench
    volumes:
      - operating-sites:/home/frappe/frappe-bench/sites
      - ../../deeplinkerp_branding:/home/frappe/frappe-bench/apps/deeplinkerp_branding/deeplinkerp_branding
      - ../..:/workspace:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    image: deeplinkerp-local:procurement-nav-20261005
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: backend:9000
      FRAPPE_SITE_NAME_HEADER: operating-expenses-qa.localhost
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 20m
    ports:
      - 127.0.0.1:64243:8080
    volumes:
      - operating-sites:/home/frappe/frappe-bench/sites
      - ../../deeplinkerp_branding:/home/frappe/frappe-bench/apps/deeplinkerp_branding/deeplinkerp_branding:ro
    depends_on:
      - backend
  worker:
    profiles: [qa-worker]
    image: deeplinkerp-local:procurement-nav-20261005
    command: [bench, worker, --queue, "default,short,long"]
    working_dir: /home/frappe/frappe-bench
    volumes:
      - operating-sites:/home/frappe/frappe-bench/sites
      - ../../deeplinkerp_branding:/home/frappe/frappe-bench/apps/deeplinkerp_branding/deeplinkerp_branding
    depends_on:
      - backend
      - redis
volumes:
  operating-sites:
  operating-db:
