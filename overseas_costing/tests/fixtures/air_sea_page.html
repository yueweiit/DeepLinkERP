<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>空运海运原生页面测试</title><link rel="stylesheet" href="../../page/air_sea_cost_comparison/air_sea_cost_comparison.css"><style>body{margin:0;font-family:system-ui}header{height:52px;border-bottom:1px solid #ddd;padding:0 22px;display:flex;align-items:center}.desk{display:flex}aside{width:190px;min-width:190px;padding:20px;background:#fafafa;box-sizing:border-box}aside a{display:block;margin:15px 0;color:#444;text-decoration:none}#page{flex:1;min-width:0}h1{font-size:22px;margin:20px}</style></head><body><header>ERPNext · 原生导航测试</header><div class="desk"><aside><b>海外成本核算</b><a href="#workbench">成本工作台</a><a href="#batches">装箱批次</a><a href="#air-sea-cost-comparison">空运海运成本对比</a></aside><div id="page"></div></div><script>
const recordStore={};let sequence=0;
window.frappe={pages:{},get_route:()=>['air-sea-cost-comparison'],router:{on(){},off(){}},set_route(){},ui:{make_app_page({parent,title}){parent.innerHTML='<h1>'+title+'</h1>';return {main:{append(node){parent.append(node)}}}}},call:async({method,args})=>{await new Promise(resolve=>setTimeout(resolve,120));const action=method.split('.').at(-1),C=window.OverseasAirSeaCalculator;
if(action==='save_record'){const name=args.name||'COMPARE-'+(++sequence);const record={name,title:args.title,modified:new Date().toISOString(),owner:'test@example.com',modified_by:'test@example.com',payload:JSON.parse(args.payload_json)};record.result=C.calculate(record.payload);recordStore[name]=record;return {message:{ok:true,record,source_changed:false}};}
if(action==='list_records')return {message:{ok:true,items:Object.values(recordStore).filter(r=>r.title.includes(args.keyword)).map(r=>({...r,status:r.result.status,sea_total:r.result.oceanTotal,air_total:r.result.airTotal})),total:Object.keys(recordStore).length,page:1,page_length:20}};
if(action==='get_record')return {message:{ok:true,record:recordStore[args.name],source_changed:true}};
if(action==='delete_record'){delete recordStore[args.name];return {message:{ok:true}};}
if(action==='search_batches')return {message:{ok:true,items:[{name:'BATCH-1',batch_no:'墨西哥批次 A',source_approval_no:'PO-123',transport_mode:'海运'}],total:1,page:1,page_length:20}};
if(action==='preview_batch'){const row=Array(30).fill('');Object.assign(row,{1:'FL001',3:'示例材料',4:'PCS',20:'100',25:'2'});return {message:{ok:true,payload:{rows:[row],parameters:{},currencies:{},source:{batch:'BATCH-1',batch_no:'墨西哥批次 A',token:'fixture'},totals_override:{grossWeight:'10',volume:'0.5'}},warnings:['毛重与体积取批次已确认的整票总量，请核对。']}};}
throw new Error('Unknown API '+action);
}};
</script><script src="../../page/air_sea_cost_comparison/air_sea_cost_comparison.js"></script><script>frappe.pages['air-sea-cost-comparison'].on_page_load(document.getElementById('page'));</script></body></html>
